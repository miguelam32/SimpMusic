name: Auto-sync upstream and release (Loved <3)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT DEL REPOSITORIO PRINCIPAL
      # ============================================================
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # CONFIGURAR IDENTIDAD DE GIT
      # ============================================================
      - name: Configure git identity
        run: |
          git config --global user.name "loved-bot"
          git config --global user.email "loved-bot@users.noreply.github.com"

      # ============================================================
      # TEST: COMPROBAR QUE CORE_PAT EXISTE
      # ============================================================
      - name: Test CORE_PAT exists
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          if [ -z "$CORE_PAT" ]; then
            echo "❌ CORE_PAT está vacío o no está disponible."
            exit 1
          fi
          echo "✅ CORE_PAT está presente."

      # ============================================================
      # MERGE UPSTREAM -> CORE/DEV
      # ============================================================
      - name: Merge upstream into core submodule
        working-directory: core
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git remote add upstream https://github.com/maxrave-dev/core.git

          echo "📥 Descargando upstream/multiplatform..."
          git fetch upstream

          echo "🌿 Cambiando a core/dev..."
          git checkout dev

          echo "🔀 Haciendo merge de upstream/multiplatform..."
          git merge upstream/multiplatform --no-edit

          git config --local --unset-all http.https://github.com/.extraheader || true
          echo "🚀 Subiendo core/dev..."
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${CORE_PAT}@github.com/miguelam32/core.git" \
            dev

          echo "✅ core/dev actualizado correctamente."

      # ============================================================
      # MERGE UPSTREAM -> REPO PRINCIPAL
      # Y ACTUALIZAR PUNTERO DEL SUBMÓDULO
      # ============================================================
      - name: Merge upstream into main repo and bump submodule pointer
        run: |
          git config submodule.recurse false
          git config fetch.recurseSubmodules no

          git remote add upstream https://github.com/maxrave-dev/SimpMusic.git

          echo "📥 Descargando upstream/dev..."
          git fetch upstream

          echo "🌿 Cambiando a dev..."
          git checkout dev

          echo "🔀 Haciendo merge de upstream/dev..."
          git merge upstream/dev --no-edit

          echo "📌 Actualizando puntero del submódulo core..."
          git add core

          git commit \
            -m "chore: auto-sync upstream + bump core submodule" \
            --allow-empty

          echo "🚀 Subiendo SimpMusic/dev..."
          git push origin dev

          echo "✅ Repositorio principal actualizado correctamente."

      # ============================================================
      # CONFIGURAR JDK 21
      # ============================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      # ============================================================
      # DECODIFICAR KEYSTORE
      # ============================================================
      - name: Set up signing key
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      # ============================================================
      # ACTIVAR BUILD FOSS (sin Sentry/Last.fm)
      # ============================================================
      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      # ============================================================
      # GENERAR aboutLibraries.json
      # ============================================================
      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      # ============================================================
      # COMPILAR Y FIRMAR APK RELEASE (FOSS)
      # ============================================================
      - name: Build and sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      # ============================================================
      # CREAR RELEASE
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Loved <3 (auto-sync ${{ github.run_number }})"
          files: androidApp/build/outputs/apk/release/*.apk
          body: "Build automatico: ultimos cambios de maxrave-dev/SimpMusic + modificaciones de letras (Loved)."
