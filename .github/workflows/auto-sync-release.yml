name: Auto-sync upstream and release (Loved <3)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "loved-bot"
          git config --global user.email "loved-bot@users.noreply.github.com"

      # ============================================================
      # TEST 1: comprobar que CORE_PAT existe
      # ============================================================
      - name: Test CORE_PAT exists
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          if [ -z "$CORE_PAT" ]; then
            echo "❌ CORE_PAT está vacío o no está disponible."
            exit 1
          fi

          echo "✅ CORE_PAT está presente."

      # ============================================================
      # TEST 2: comprobar que CORE_PAT puede acceder a miguelam32/core
      # ============================================================
      - name: Test CORE_PAT access to core repository
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          echo "🔎 Probando acceso a miguelam32/core..."

          if git ls-remote \
            "https://x-access-token:${CORE_PAT}@github.com/miguelam32/core.git" \
            HEAD >/dev/null 2>&1
          then
            echo "✅ CORE_PAT puede acceder a miguelam32/core."
          else
            echo "❌ CORE_PAT NO puede acceder a miguelam32/core."
            echo "Revisa que el token tenga acceso al repositorio y permisos de escritura."
            exit 1
          fi

      # ============================================================
      # SYNC CORE
      # ============================================================
      - name: Merge upstream into core submodule
        working-directory: core
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git remote add upstream https://github.com/maxrave-dev/core.git
          git fetch upstream
          git checkout dev
          git merge upstream/multiplatform --no-edit

          echo "🚀 Subiendo core/dev..."

          git push \
            "https://x-access-token:${CORE_PAT}@github.com/miguelam32/core.git" \
            dev

      # ============================================================
      # SYNC MAIN REPOSITORY
      # ============================================================
      - name: Merge upstream into main repo and bump submodule pointer
        run: |
          git remote add upstream https://github.com/maxrave-dev/SimpMusic.git
          git fetch upstream
          git checkout dev
          git merge upstream/dev --no-edit
          git add core
          git commit -m "chore: auto-sync upstream + bump core submodule" --allow-empty
          git push origin dev

      # ============================================================
      # JAVA
      # ============================================================
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      # ============================================================
      # FULL BUILD
      # ============================================================
      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      # ============================================================
      # RELEASE
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Loved <3 (auto-sync ${{ github.run_number }})"
          files: androidApp/build/outputs/apk/debug/*.apk
          body: "Build automatico: ultimos cambios de maxrave-dev/SimpMusic + modificaciones de letras (Loved)."
